version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: linkshortener-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: linkshortener
      POSTGRES_USER: nicolas
      POSTGRES_PASSWORD: 12345
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: